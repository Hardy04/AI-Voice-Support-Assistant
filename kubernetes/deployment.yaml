apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-voice-assistant
spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-voice-assistant

  template:
    metadata:
      labels:
        app: ai-voice-assistant

    spec:
      containers:
      - name: ai-voice-assistant
        image: ai-voice-assistant:latest
        
        ports:
        - containerPort: 8000
